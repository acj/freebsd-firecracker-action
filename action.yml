name: FreeBSD Firecracker VM
author: Adam Jensen (@acj)
description: Launch a FreeBSD VM in Firecracker and run a script inside it

inputs:
  kernel-url:
    type: string
    required: false
    default: https://github.com/acj/freebsd-firecracker/releases/download/v0.11.0/freebsd-kern.bin
  rootfs-url:
    type: string
    required: false
    default: https://github.com/acj/freebsd-firecracker/releases/download/v0.11.0/freebsd-rootfs.bin.xz
  firecracker-url:
    type: string
    required: false
    default: https://github.com/acj/freebsd-firecracker/releases/download/v0.11.0/firecracker
  ssh-public-key-url:
    type: string
    required: false
    default: https://github.com/acj/freebsd-firecracker/releases/download/v0.11.0/freebsd.id_rsa.pub
  ssh-private-key-url:
    type: string
    required: false
    default: https://github.com/acj/freebsd-firecracker/releases/download/v0.11.0/freebsd.id_rsa
  pre-run:
    description: |
      An optional script to run before starting the FreeBSD virtual machine. This script runs on
      the host. By default, it copies the contents of the workspace directory into the VM.
    required: false
    type: string
    default: |
      exclude_path="$(mktemp)"
      cat <<EOF > $exclude_path
      .git
      .github
      .gitignore
      .gitmodules
      LICENSE
      README.md
      README.txt
      README
      action.yml
      EOF
      
      rsync -r -e "ssh" \
        --relative \
        --copy-links \
        --exclude-from "$exclude_path" \
        . firecracker:
      rm -f "$exclude_path"
  run-in-vm:
    description: The script to run inside the FreeBSD virtual machine
    required: true
    type: string
  post-run:
    description: |
      An optional script to run after the `run-in-vm` script exits. This script runs on the host.
      By default, it copies the contents of the VM's `/root` directory into the workspace directory.
    required: false
    type: string
    default: |
      rsync -r -e "ssh" \
        --relative \
        --copy-links \
        --exclude-from "$exclude_path" \
        firecracker: .
  checkout:
    required: false
    type: boolean
    default: true
  continue-on-error:
    required: false
    type: boolean
    default: false
  verbose:
    required: false
    type: boolean
    default: false
  disk-size:
    required: false
    type: string
    default: "2G"
  vcpu-count:
    description: Number of vCPUs to expose to the VM. Use "auto" to match the host's logical core count.
    required: false
    type: string
    default: "auto"

runs:
  using: "composite"

  steps:
    - name: Checkout
      if: inputs.checkout == 'true'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        path: firecracker-freebsd

    - name: Print diagnostic info
      shell: bash
      if: inputs.verbose == 'true'
      run: |
        echo "CPU info:"
        cat /proc/cpuinfo
        echo "Memory info:"
        cat /proc/meminfo
        echo "Kernel version:"
        uname -a
        echo "Kernel command line:"
        cat /proc/cmdline
        echo "Network interfaces:"
        ip addr show

    - name: Start Firecracker VM
      shell: sudo bash -e {0}
      run: |
        kernel_path="$(mktemp)"
        wget -q -O "$kernel_path" ${{ inputs.kernel-url }}
        
        rootfs_path="$(mktemp)"
        wget -q -O /tmp/freebsd-rootfs.bin.xz ${{ inputs.rootfs-url }}
        xz -T 0 -d /tmp/freebsd-rootfs.bin.xz
        truncate -s ${{ inputs.disk-size }} /tmp/freebsd-rootfs.bin
        mv /tmp/freebsd-rootfs.bin "$rootfs_path"

        firecracker_path="$(mktemp)"
        wget -q -O "$firecracker_path" ${{ inputs.firecracker-url }}
        chmod +x "$firecracker_path"

        public_key_path="$(mktemp)"
        private_key_path="$(mktemp)"
        wget -q -O "$public_key_path" ${{ inputs.ssh-public-key-url }}
        wget -q -O "$private_key_path" ${{ inputs.ssh-private-key-url }}
        install -D -o $SUDO_USER -m 600 -T "$private_key_path" /etc/ssh/freebsd.id_rsa

        cat <<EOF > /etc/ssh/ssh_config.d/firecracker.conf
        Host firecracker
          Hostname 172.16.0.2
          User root
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
          IdentityFile /etc/ssh/freebsd.id_rsa
        EOF

        sudo setfacl -m u:${USER}:rw /dev/kvm

        INET_DEV="eth0"
        TAP_DEV="tap0"
        TAP_IP="172.16.0.1"
        MASK_SHORT="/24"
        
        # Setup network interface
        sudo ip link del "$TAP_DEV" 2> /dev/null || true
        sudo ip tuntap add dev "$TAP_DEV" mode tap
        sudo ip addr add "${TAP_IP}${MASK_SHORT}" dev "$TAP_DEV"
        sudo ip link set dev "$TAP_DEV" up
        
        # Enable ip forwarding
        sudo sh -c "echo 1 > /proc/sys/net/ipv4/ip_forward"
        
        # Set up microVM internet access
        sudo iptables -t nat -D POSTROUTING -o "$INET_DEV" -j MASQUERADE || true
        sudo iptables -D FORWARD -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT || true
        sudo iptables -D FORWARD -i tap0 -o "$INET_DEV" -j ACCEPT || true
        sudo iptables -t nat -A POSTROUTING -o "$INET_DEV" -j MASQUERADE
        sudo iptables -I FORWARD 1 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
        sudo iptables -I FORWARD 1 -i tap0 -o "$INET_DEV" -j ACCEPT
        
        API_SOCKET="/tmp/firecracker.socket"
        
        KERNEL="$kernel_path"
        KERNEL_BOOT_ARGS="vfs.root.mountfrom=ufs:/dev/vtbd0"

        # Pass the host's TSC frequency (in Hz) so that the patched kernel used by
        # freebsd-firecracker can use it directly instead of fudging it. Using a real frequency
        # avoids FreeBSD TSC initialization failures that we've seen on some CPUs.
        host_tsc_mhz="$(dmesg 2>/dev/null | sed -n 's/.*Refined TSC clocksource calibration: \([0-9.]*\) MHz.*/\1/p' | tail -1)"
        if [ -z "$host_tsc_mhz" ]; then
          host_tsc_mhz="$(dmesg 2>/dev/null | sed -n 's/.*Detected \([0-9.]*\) MHz processor.*/\1/p' | tail -1)"
        fi
        if [ -n "$host_tsc_mhz" ]; then
          host_tsc_hz="$(awk "BEGIN{printf \"%d\", $host_tsc_mhz*1000000}")"
          KERNEL_BOOT_ARGS="$KERNEL_BOOT_ARGS machdep.tsc_freq=$host_tsc_hz"
          echo "Host TSC frequency: ${host_tsc_mhz} MHz (${host_tsc_hz} Hz)"
        else
          echo "⚠️ Warning: could not determine host TSC frequency, which may cause the guest to panic during boot. If you see a panic, try using \`vcpu-count: 1\` as a workaround."
        fi

        ROOTFS="$rootfs_path"
        VCPU_COUNT="${{ inputs.vcpu-count }}"
        if [ "$VCPU_COUNT" = "auto" ]; then
          VCPU_COUNT="$(nproc 2>/dev/null || echo 1)"
        fi
        if ! [[ "$VCPU_COUNT" =~ ^[1-9][0-9]*$ ]]; then
          echo "vcpu-count must be a positive integer or auto"
          exit 1
        fi
        echo "Using $VCPU_COUNT vCPU(s)"
        
        # The IP address of a guest is derived from its MAC address with
        # `fcnet-setup.sh`, this has been pre-configured in the guest rootfs. It is
        # important that `TAP_IP` and `FC_MAC` match this.
        FC_MAC="06:00:AC:10:00:02"

        cat <<EOF > vmconfig.json
        {
          "boot-source": {
            "kernel_image_path": "$KERNEL",
            "boot_args": "$KERNEL_BOOT_ARGS"
          },
          "drives": [
            {
              "drive_id": "rootfs",
              "path_on_host": "$ROOTFS",
              "is_root_device": true,
              "is_read_only": false
            }
          ],
          "network-interfaces": [
              {
                  "iface_id": "eth0",
                  "guest_mac": "$FC_MAC",
                  "host_dev_name": "$TAP_DEV"
              }
          ],
          "machine-config": {
            "vcpu_count": $VCPU_COUNT,
            "mem_size_mib": 5120,
            "smt": false
          }
        }
        EOF

        for vm_start_attempt in {1..3}; do
          if [ -e "$API_SOCKET" ]; then
            echo "Removing stale API socket from previous run"
            rm -f "$API_SOCKET"
          fi

          LOGFILE="/tmp/firecracker.log"
          touch $LOGFILE
          if [ ${{ inputs.verbose }} = true ]; then
            nohup $firecracker_path --api-sock $API_SOCKET --config-file vmconfig.json --log-path $LOGFILE &
          else
            nohup $firecracker_path --api-sock $API_SOCKET --config-file vmconfig.json --log-path $LOGFILE > /dev/null 2>&1 &
          fi
          firecracker_pid=$!
          echo "$firecracker_pid" > /tmp/firecracker.pid

          set +e
          vm_started=false
          for vm_connect_attempt in {1..5}; do
            ssh firecracker true
            if [ $? -eq 0 ]; then
              vm_started=true
              break
            fi
            sleep 1
          done
          if [ $vm_started = true ]; then
            break
          else
            echo "Attempt $vm_start_attempt: Firecracker VM did not start, retrying..."
            kill "$firecracker_pid" || true
            wait "$firecracker_pid" || true

            echo "::group::ℹ️ Firecracker VM log (attempt $vm_start_attempt)"
            cat $LOGFILE
            echo "::endgroup::"
            rm -f $LOGFILE
          fi
          set -e
        done

        if [ "$vm_started" = true ]; then
          echo "✅ Firecracker VM started successfully"
        else
          echo "❌ Failed to start Firecracker VM after multiple attempts. Please report this issue and include the Firecracker VM log below."
          exit 1
        fi

    - name: Run user scripts
      shell: bash -e {0}
      env:
        PRE_RUN_SCRIPT: ${{ inputs.pre-run }}
        RUN_IN_VM_SCRIPT: ${{ inputs.run-in-vm }}
        POST_RUN_SCRIPT: ${{ inputs.post-run }}
      run: |
        firecracker_pid=$(cat /tmp/firecracker.pid)
        pre_run_script=$(mktemp)
        run_in_vm_script=$(mktemp)
        post_run_script=$(mktemp)
        printf '%s\n' "$PRE_RUN_SCRIPT" > $pre_run_script
        printf '%s\n' "$RUN_IN_VM_SCRIPT" > $run_in_vm_script
        printf '%s\n' "$POST_RUN_SCRIPT" > $post_run_script
        
        scp $run_in_vm_script firecracker:/tmp/.fbsd_fc_run_script

        sh -e $pre_run_script

        ssh firecracker 'mkfifo /tmp/.fbsd_fc_exit_code'
        set +e
        ssh firecracker 'sh -e /tmp/.fbsd_fc_run_script; echo $? > /tmp/.fbsd_fc_exit_code' &
        ssh firecracker 'echo "Launched script and waiting for it to exit"; code=$(cat /tmp/.fbsd_fc_exit_code); echo "Script exited with code $code"; exit $code'
        script_exit_code=$?
        set -e

        if [ $script_exit_code -eq 0 ] || [ ${{ inputs.continue-on-error }} = true ]; then
          sh -e $post_run_script
        fi
        
        # Shut down quickly. See https://man.freebsd.org/cgi/man.cgi?query=halt
        ssh firecracker reboot || true
        tail --pid=$firecracker_pid -f /dev/null || true

        exit $script_exit_code

    - name: Attach VM logs
      if: always()
      shell: bash -e {0}
      run: |
        echo "::group::ℹ️ Firecracker VM log (please link to this or attach the log contents when reporting a bug in this action)"
        cat /tmp/firecracker.log
        echo "::endgroup::"
